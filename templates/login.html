{% extends 'base.html' %}

{% block content %}
<div class="form-style">
    <h1>Log in</h1>
    
    <!-- Display error messages -->
    {% if messages %}
    <div class="messages">
        {% for message in messages %}
        <div class="alert {% if message.tags %}alert-{{ message.tags }}{% endif %}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    
    <form class="site-form" action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <br>
        <div style="text-align: center;">
            <input class="submit" type="submit" value="Log in" style="background-color: #feda6a; color: black; font-weight: bold; padding: 10px 30px; border: none; cursor: pointer; font-size: 18px;">
        </div>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <p style="color: white; font-size: 16px;">Don't have an account? 
            <a href="{% url 'signup' %}" style="color: #feda6a; text-decoration: none; font-size: 20px; font-weight: bold;">Sign up here</a>
        </p>
        <p style="color: white; font-size: 16px;">
            <a href="{% url 'password_reset' %}" style="color: #feda6a; text-decoration: none; font-size: 20px; font-weight: bold;">Forgot Password?</a>
        </p>
    </div>
</div>

<style>
.form-style {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
    /* background-color: rgba(0, 0, 0, 0.8); */
    border-radius: 10px;
    /* box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); */
}

h1 {
    text-align: center;
    color: #feda6a;
    font-size: 28px;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 5px;
    color: white;
}

.form-group input {
    width: 100%;
    padding: 8px;
    border: 1px solid #ddd;
    border-radius: 4px;
    box-sizing: border-box;
}

.submit {
    background-color: #feda6a;
    color: black;
    font-weight: bold;
    padding: 12px 40px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
    transition: background-color 0.3s ease;
    display: block;
    margin: 20px auto;
}

.submit:hover {
    background-color: #e5c55f;
}

.extra-links {
    text-align: center;
    margin-top: 20px;
    color: white;
}

.extra-links a {
    color: #feda6a;
    text-decoration: none;
    font-weight: bold;
}

.extra-links a:hover {
    text-decoration: underline;
}

.alert {
    padding: 12px;
    margin-bottom: 20px;
    border-radius: 5px;
    text-align: center;
}

.alert-error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
}
</style>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // Add form submission handling
        const form = document.querySelector('.site-form');
        form.addEventListener('submit', function(e) {
            const submitBtn = form.querySelector('input[type="submit"]');
            submitBtn.value = 'Logging in...';
            submitBtn.disabled = true;
        });
    });
</script>
{% endblock %}
