<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .otp-container {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .otp-code {
            font-size: 32px;
            font-weight: bold;
            color: #007bff;
            letter-spacing: 5px;
            margin: 20px 0;
        }
        .warning {
            color: #dc3545;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div style="background-color: #ffffff; padding: 20px;">
        <h2 style="color: #333; text-align: center;">Sign Language Converter - Email Verification</h2>
        
        <div style="text-align: center; margin: 20px 0;">
            <p style="font-size: 16px;">Your verification code is:</p>
            <div style="
                background-color: #f8f9fa;
                border: 2px solid #007bff;
                border-radius: 8px;
                padding: 15px;
                margin: 20px auto;
                max-width: 200px;
                font-size: 24px;
                font-weight: bold;
                letter-spacing: 5px;
                color: #007bff;
            ">
                {{ otp }}
            </div>
            
            <p style="font-size: 14px; color: #666;">
                This code will expire in 10 minutes.
            </p>
        </div>
        
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; text-align: center; font-size: 12px; color: #666;">
            <p>⚠️ Never share this verification code with anyone.</p>
            <p>If you didn't request this code, please ignore this email.</p>
        </div>
    </div>
</body>
</html>
